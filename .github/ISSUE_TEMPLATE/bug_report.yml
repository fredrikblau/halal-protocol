name: Bug report
description: Report a reproducible protocol, frontend, documentation, or tooling problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not disclose security vulnerabilities publicly. Read [SECURITY.md](https://github.com/fredrikblau/halal-protocol/blob/main/SECURITY.md) and use the [private advisory form](https://github.com/fredrikblau/halal-protocol/security/advisories/new) instead.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the smallest reproducible steps, command, transaction hash, or code sample.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, chain/network, commit, wallet, or Foundry version
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove private keys, seed phrases, API keys, and personal information.
  - type: checkboxes
    id: safe-reporting
    attributes:
      label: Safe public report
      options:
        - label: I confirm this is not a suspected security vulnerability; I will use [SECURITY.md](https://github.com/fredrikblau/halal-protocol/blob/main/SECURITY.md) and the private advisory form for fund-risking or access-control concerns.
          required: true
