name: Release artifacts

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build and attest source bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify citation version matches release tag
        run: |
          set -euo pipefail
          expected_version="${RELEASE_TAG#v}"
          citation_version="$(awk -F': ' '$1 == "version" { print $2; exit }' CITATION.cff)"
          test -n "$citation_version"
          test "$citation_version" = "$expected_version"

      - name: Build reproducible source bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/halal-protocol-${RELEASE_TAG}.tar.gz"
          git archive --format=tar --prefix="halal-protocol-${RELEASE_TAG}/" "$RELEASE_TAG" | gzip -n > "$archive"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          cat "${archive}.sha256"

      - name: Attest source bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/halal-protocol-${{ env.RELEASE_TAG }}.tar.gz

      - name: Attach bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
