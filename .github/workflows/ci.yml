name: CI

# Per-subtree path filtering is done with dorny/paths-filter (job-level, via the `changes` job
# below) rather than a top-level `on.push.paths`, so that both jobs still show up individually
# (and skip cleanly) in the PR checks UI instead of the whole workflow silently not running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      app: ${{ steps.filter.outputs.app }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/**'
              - 'Makefile'
            app:
              - 'app/**'
              # Only these root-level paths are consumed by the dApp checks. Keep monitoring and
              # report-preparation scripts out of the expensive browser job unless they are wired
              # into the local app smoke fixture in the future.
              - 'scripts/local-app-smoke.sh'
              - 'scripts/validate-deployment-registry.mjs'
              - 'scripts/preflight-deployment.mjs'
              - 'Makefile'
            docs:
              - '**/*.md'
              - 'README.md'
              - 'Makefile'

  contracts:
    name: Contracts (Foundry)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Cache forge build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            contracts/cache
            contracts/out
          # Include first-party sources in the key. Foundry's cache can otherwise restore an
          # artifact set produced before a source change, which can hide newly added tests.
          key: foundry-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/foundry.lock', 'contracts/src/**/*.sol', 'contracts/test/**/*.sol', 'contracts/script/**/*.sol') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: forge fmt --check (first-party code)
        # Dependencies are checked out under contracts/lib and are maintained upstream. Formatting
        # only owned code keeps this gate deterministic across Foundry formatter releases.
        run: forge fmt --check src test script

      - name: forge build
        run: forge build --force --sizes

      - name: Local deployment smoke test
        run: |
          ANVIL_MNEMONIC='test test test test test test test test test test test junk'
          DEPLOY_LOG=/tmp/halal-deploy.log
          anvil --silent --mnemonic "$ANVIL_MNEMONIC" --port 18545 >/tmp/halal-anvil.log 2>&1 &
          ANVIL_PID=$!
          trap 'kill "$ANVIL_PID"' EXIT
          until cast chain-id --rpc-url http://127.0.0.1:18545 >/dev/null 2>&1; do sleep 1; done
          LOCAL_PRIVATE_KEY=$(cast wallet derive --insecure "$ANVIL_MNEMONIC" | awk '/Private key:/ { print $3; exit }')
          LOCAL_UPDATER_KEY=$(cast wallet derive --insecure --accounts 2 "$ANVIL_MNEMONIC" | awk '/Private key:/ { key=$3 } END { print key }')
          LOCAL_UPDATER_ADDRESS=$(cast wallet address --private-key "$LOCAL_UPDATER_KEY")
          PRIVATE_KEY="$LOCAL_PRIVATE_KEY" \
            CPI_UPDATER="$LOCAL_UPDATER_ADDRESS" \
            forge script script/DeployLocal.s.sol:DeployLocalHalalSystem \
            --rpc-url http://127.0.0.1:18545 --broadcast --non-interactive --force | tee "$DEPLOY_LOG"
          value_from_env() {
            awk -F= -v key="$1" '$1 ~ key {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2}' "$DEPLOY_LOG"
          }
          RPC_URL=http://127.0.0.1:18545 EXPECTED_CHAIN_ID=31337 \
            TIMELOCK="$(value_from_env NEXT_PUBLIC_HLC_TIMELOCK_31337)" \
            TOKEN="$(value_from_env NEXT_PUBLIC_HLC_TOKEN_31337)" \
            TEAM_VESTING="$(value_from_env NEXT_PUBLIC_HLC_TEAM_VESTING_31337)" \
            TREASURY_VESTING="$(value_from_env NEXT_PUBLIC_HLC_TREASURY_VESTING_31337)" \
            DAO="$(value_from_env NEXT_PUBLIC_HLC_DAO_31337)" \
            PSM="$(value_from_env NEXT_PUBLIC_HLC_PSM_31337)" \
            RESERVE_TOKEN="$(awk '/Local demo reserve:/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $4); print $4}' "$DEPLOY_LOG")" \
            TEAM_BENEFICIARY="$(cast wallet address --private-key "$LOCAL_PRIVATE_KEY")" \
            TREASURY_BENEFICIARY="$(cast wallet address --private-key "$LOCAL_PRIVATE_KEY")" \
            DEPLOYER_ADDRESS="$(cast wallet address --private-key "$LOCAL_PRIVATE_KEY")" \
            ALLOW_DEPLOYER_BENEFICIARY=true \
            CPI_UPDATER="$LOCAL_UPDATER_ADDRESS" \
            ../scripts/verify-deployment.sh
          PSM_ADDRESS="$(value_from_env NEXT_PUBLIC_HLC_PSM_31337)"
          set +e
          HEALTH_OUTPUT=$(RPC_URL=http://127.0.0.1:18545 PSM="$PSM_ADDRESS" \
            FAIL_ON_UPDATE_OVERDUE=false ../scripts/check-psm-health.sh 2>&1)
          HEALTH_EXIT=$?
          set -e
          test "$HEALTH_EXIT" -ne 0
          echo "$HEALTH_OUTPUT" | grep -q 'reason=timestamped_cpi_report_missing'
          REPORT_AT=$(cast block latest --field timestamp --rpc-url http://127.0.0.1:18545)
          cast send "$PSM_ADDRESS" 'updateCPIWithTimestamp(uint256,uint256)' 1000000 "$REPORT_AT" \
            --private-key "$LOCAL_UPDATER_KEY" --rpc-url http://127.0.0.1:18545 >/dev/null
          RPC_URL=http://127.0.0.1:18545 PSM="$PSM_ADDRESS" ../scripts/check-psm-health.sh | grep -q '^status=healthy$'

      - name: forge test
        run: forge test --force -vvv

      - name: Verify current documentation test counts
        working-directory: .
        run: make test-counts

      - name: forge lint (first-party code)
        run: forge lint src test script --severity high --severity med --severity low --severity gas

      - name: Economic model smoke test
        working-directory: .
        run: |
          node scripts/model-psm.mjs --months=24 --monthly-inflation-bps=50 > /tmp/halal-economic-model.csv
          grep -q '^24,' /tmp/halal-economic-model.csv
          grep -q '^24,.*,-[1-9]' /tmp/halal-economic-model.csv
          node scripts/model-psm.mjs --months=24 --monthly-inflation-bps=50 --apply-topups=true > /tmp/halal-economic-model-topups.csv
          grep -q '^24,.*,+0,' /tmp/halal-economic-model-topups.csv

      - name: Signed CPI adapter rehearsal
        working-directory: .
        run: make adapter-demo

  abi:
    name: Verify generated ABIs
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Build contracts
        working-directory: contracts
        run: forge build --force

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Regenerate and compare ABIs
        working-directory: app
        run: |
          pnpm gen:abis
          git diff --exit-code -- src/abis

  scripts:
    name: Scripts (Node)
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Shell syntax
        run: bash -n scripts/*.sh

      - name: ShellCheck (pinned)
        # Keep this toolchain pinned and scan only first-party shell entrypoints. The image digest
        # makes the operational-script gate reproducible across hosted runners.
        run: >-
          docker run --rm -v "$GITHUB_WORKSPACE/scripts:/mnt:ro"
          koalaman/shellcheck:v0.10.0@sha256:2097951f02e735b613f4a34de20c40f937a6c8f18ecb170612c88c34517221fb
          /mnt/check-deployment-health.sh /mnt/check-psm-health.sh /mnt/local-adapter-demo.sh
          /mnt/local-app-smoke.sh /mnt/local-demo.sh /mnt/verify-deployment.sh

      - name: Validate deployment registry
        run: node scripts/validate-deployment-registry.mjs

      - name: Node script tests
        run: node --test scripts/test/*.test.mjs

  documentation:
    name: Documentation (Markdown links)
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Validate Markdown links and anchors
        run: make markdown-links

      - name: Verify current documentation test counts
        run: make test-counts

  app:
    name: Frontend (Next.js)
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    # The local smoke script owns disposable Anvil/Next processes. Bound the job so a runner or
    # child-process hang becomes an actionable failure instead of an indefinitely pending check.
    # Browser dependency installation and the disposable Anvil/Next processes can consume several
    # minutes on a cold hosted runner; allow cleanup after the test process reports its result.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.23.0

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm lint
        run: pnpm lint

      - name: Validate deployment registry
        run: node ../scripts/validate-deployment-registry.mjs

      - name: pnpm audit (production dependencies)
        run: pnpm audit --prod --audit-level=high

      - name: Configured local dApp smoke test
        # Bound the disposable Anvil/Next harness separately so a child-process hang produces a
        # useful failure before the 30-minute job timeout.
        run: timeout --signal=TERM --kill-after=30s 10m ../scripts/local-app-smoke.sh

      - name: Install Playwright Chromium
        # Browser downloads can stall independently of the test process on a hosted runner.
        run: timeout --signal=TERM --kill-after=30s 10m pnpm exec playwright install --with-deps chromium

      - name: Browser permit-flow test
        # Keep a hung browser or child server from leaving a required check pending indefinitely.
        run: timeout --signal=TERM --kill-after=30s 15m pnpm test:e2e
