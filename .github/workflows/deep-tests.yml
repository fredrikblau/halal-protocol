name: Deep contract tests

on:
  push:
    branches: [main]
  # This context is required by main branch protection. Run it for pull requests as well as the
  # scheduled/main-branch assurance pass; otherwise every PR is permanently blocked by a check
  # that can never be produced for its head commit.
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-and-invariants:
    name: Extended fuzzing and invariants
    runs-on: ubuntu-latest
    # Extended fuzzing is intentionally heavier than the PR gate, but it must still fail visibly
    # if a runner or Foundry process stops making progress.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: contracts
    env:
      FOUNDRY_FUZZ_RUNS: 10000
      FOUNDRY_INVARIANT_RUNS: 128
      FOUNDRY_INVARIANT_DEPTH: 64
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1

      - name: Extended PSM fuzz test
        run: forge test --match-test testFuzz_RoundTripNeverOverpays

      - name: Extended PSM arithmetic differential tests
        run: forge test --match-path test/HalalPSMArithmetic.t.sol

      - name: Extended PSM invariant suite
        run: forge test --match-path test/HalalPSMInvariant.t.sol
