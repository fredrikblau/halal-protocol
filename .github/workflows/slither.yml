name: Slither

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts for Slither
        working-directory: contracts
        run: forge build --build-info --deny never --skip ./test/** ./script/** --force

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.6

      - name: Run Slither
        working-directory: contracts
        run: |
          slither . \
            --exclude-dependencies \
            --filter-paths "src" \
            --sarif ../slither-results.sarif

      - name: Enforce high-severity findings policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(Path("slither-results.sarif").read_text())["runs"][0]["results"]
          high = [result for result in results if result.get("level") == "error"]
          if high:
              print(f"Slither reported {len(high)} high-severity finding(s).")
              raise SystemExit(1)
          print(f"Slither reported {len(results)} finding(s); no high-severity findings.")
          PY

      - name: Upload Slither results
        if: always() && hashFiles('slither-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: slither-results.sarif
